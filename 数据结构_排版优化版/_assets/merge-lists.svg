<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker><marker id="green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#16a34a"/></marker><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity=".10"/></filter></defs>
<style>.title{font:700 26px 'Microsoft YaHei',sans-serif;fill:#172b4d}.subtitle{font:14px 'Microsoft YaHei',sans-serif;fill:#64748b}.body{font:14px 'Microsoft YaHei',sans-serif;fill:#334155}.panelTitle{font:700 18px 'Microsoft YaHei',sans-serif;fill:#172b4d}.blue{fill:#1d4ed8}.orange{fill:#c2410c}.green{fill:#15803d}.node{stroke-width:2;filter:url(#shadow)}.l1{fill:#dbeafe;stroke:#2563eb}.l2{fill:#ffedd5;stroke:#f97316}.result{fill:#dcfce7;stroke:#16a34a;stroke-width:2;filter:url(#shadow)}.dummy{fill:#e2e8f0;stroke:#64748b;stroke-width:2;stroke-dasharray:6 5}.value{font:700 21px 'Microsoft YaHei',sans-serif;fill:#172b4d}.arrow{stroke:#2563eb;stroke-width:3;marker-end:url(#arrow)}.greenArrow{stroke:#16a34a;stroke-width:3;marker-end:url(#green)}.nil{font:700 30px 'Microsoft YaHei',sans-serif;fill:#94a3b8}.accent{font:700 14px 'Microsoft YaHei',sans-serif;fill:#c2410c}.divider{stroke:#cbd5e1;stroke-width:2;stroke-dasharray:8 7}.note{fill:#f8fafc;stroke:#cbd5e1}.tiny{font:12px 'Microsoft YaHei',sans-serif;fill:#64748b}</style>
<text x="500" y="42" text-anchor="middle" class="title">合并两个升序链表：每次摘取更小的头结点</text>
<text x="500" y="71" text-anchor="middle" class="subtitle">用哑结点 dummy 固定结果链表的“入口”，prev 始终指向结果链表尾部</text>
<g transform="translate(0,105)">
<text x="45" y="45" class="panelTitle blue">链表 l1</text><rect x="165" y="15" width="90" height="58" rx="9" class="node l1"/><text x="210" y="51" text-anchor="middle" class="value">1</text><line x1="255" y1="44" x2="305" y2="44" class="arrow"/><rect x="310" y="15" width="90" height="58" rx="9" class="node l1"/><text x="355" y="51" text-anchor="middle" class="value">2</text><line x1="400" y1="44" x2="450" y2="44" class="arrow"/><rect x="455" y="15" width="90" height="58" rx="9" class="node l1"/><text x="500" y="51" text-anchor="middle" class="value">4</text><line x1="545" y1="44" x2="595" y2="44" class="arrow"/><text x="630" y="54" class="nil">∅</text>
<text x="45" y="125" class="panelTitle orange">链表 l2</text><rect x="165" y="95" width="90" height="58" rx="9" class="node l2"/><text x="210" y="131" text-anchor="middle" class="value">1</text><line x1="255" y1="124" x2="305" y2="124" class="arrow"/><rect x="310" y="95" width="90" height="58" rx="9" class="node l2"/><text x="355" y="131" text-anchor="middle" class="value">3</text><line x1="400" y1="124" x2="450" y2="124" class="arrow"/><rect x="455" y="95" width="90" height="58" rx="9" class="node l2"/><text x="500" y="131" text-anchor="middle" class="value">4</text><line x1="545" y1="124" x2="595" y2="124" class="arrow"/><text x="630" y="134" class="nil">∅</text>
<text x="760" y="74" class="accent">规则：l1-&gt;val &lt;= l2-&gt;val</text><text x="760" y="103" class="body">相等时先取 l1，结果仍稳定有序</text>
</g>
<line x1="45" y1="285" x2="955" y2="285" class="divider"/>
<g transform="translate(0,300)">
<text x="45" y="42" class="panelTitle green">结果链表</text>
<rect x="150" y="12" width="110" height="60" rx="9" class="dummy"/><text x="205" y="49" text-anchor="middle" class="body">dummy</text>
<line x1="260" y1="42" x2="310" y2="42" class="arrow"/>
<rect x="315" y="12" width="72" height="60" rx="9" class="result"/><text x="351" y="49" text-anchor="middle" class="value">1</text>
<line x1="387" y1="42" x2="432" y2="42" class="arrow"/>
<rect x="437" y="12" width="72" height="60" rx="9" class="result"/><text x="473" y="49" text-anchor="middle" class="value">1</text>
<line x1="509" y1="42" x2="554" y2="42" class="arrow"/>
<rect x="559" y="12" width="72" height="60" rx="9" class="result"/><text x="595" y="49" text-anchor="middle" class="value">2</text>
<line x1="631" y1="42" x2="676" y2="42" class="arrow"/>
<rect x="681" y="12" width="72" height="60" rx="9" class="result"/><text x="717" y="49" text-anchor="middle" class="value">3</text>
<line x1="753" y1="42" x2="798" y2="42" class="arrow"/>
<rect x="803" y="12" width="72" height="60" rx="9" class="result"/><text x="839" y="49" text-anchor="middle" class="value">4</text>
<line x1="875" y1="42" x2="915" y2="42" class="arrow"/>
<rect x="920" y="12" width="45" height="60" rx="9" class="result"/><text x="942" y="49" text-anchor="middle" class="value">4</text>
<text x="115" y="118" class="tiny">返回 dummy.next</text><path d="M175 103 L205 75" class="greenArrow"/>
<rect x="315" y="105" width="650" height="62" rx="12" class="note"/><text x="640" y="143" text-anchor="middle" class="body">任意一方为空后，不必继续比较：直接把另一条剩余链表接在 prev-&gt;next。</text>
</g>
</svg>