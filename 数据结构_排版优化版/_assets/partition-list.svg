<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker><marker id="green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#16a34a"/></marker><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity=".10"/></filter></defs>
<style>.title{font:700 26px 'Microsoft YaHei',sans-serif;fill:#172b4d}.subtitle{font:14px 'Microsoft YaHei',sans-serif;fill:#64748b}.body{font:15px 'Microsoft YaHei',sans-serif;fill:#334155}.tiny{font:12px 'Microsoft YaHei',sans-serif;fill:#64748b}.value{font:700 21px 'Microsoft YaHei',sans-serif;fill:#172b4d}.panelTitle{font:700 18px 'Microsoft YaHei',sans-serif;fill:#172b4d}.blue{fill:#1d4ed8}.green{fill:#15803d}.small{fill:#dbeafe;stroke:#2563eb;stroke-width:2;filter:url(#shadow)}.large{fill:#ffedd5;stroke:#f97316;stroke-width:2;filter:url(#shadow)}.dummy{fill:#f1f5f9;stroke:#94a3b8;stroke-width:2;stroke-dasharray:6 5}.arrow{fill:none;stroke:#2563eb;stroke-width:3;marker-end:url(#arrow)}.joinArrow{fill:none;stroke:#16a34a;stroke-width:4;marker-end:url(#green)}.accent{font:700 14px 'Microsoft YaHei',sans-serif;fill:#15803d}.tagTextGreen{font:700 17px 'Microsoft YaHei',sans-serif;fill:#15803d}.tagTextOrange{font:700 17px 'Microsoft YaHei',sans-serif;fill:#c2410c}.divider{stroke:#cbd5e1;stroke-width:2;stroke-dasharray:8 7}</style>
<text x="500" y="42" text-anchor="middle" class="title">分隔链表：拆成 small / large 两条链，再首尾相接</text>
<text x="500" y="71" text-anchor="middle" class="subtitle">示例：head = [1,4,3,2,5,2]，x = 3</text>
<g transform="translate(0,105)">
<text x="45" y="38" class="panelTitle blue">① 原链表</text>
<rect x="170" y="12" width="75" height="58" rx="9" class="small"/><text x="207" y="48" text-anchor="middle" class="value">1</text><line x1="245" y1="41" x2="290" y2="41" class="arrow"/><rect x="295" y="12" width="75" height="58" rx="9" class="large"/><text x="332" y="48" text-anchor="middle" class="value">4</text><line x1="370" y1="41" x2="415" y2="41" class="arrow"/><rect x="420" y="12" width="75" height="58" rx="9" class="large"/><text x="457" y="48" text-anchor="middle" class="value">3</text><line x1="495" y1="41" x2="540" y2="41" class="arrow"/><rect x="545" y="12" width="75" height="58" rx="9" class="small"/><text x="582" y="48" text-anchor="middle" class="value">2</text><line x1="620" y1="41" x2="665" y2="41" class="arrow"/><rect x="670" y="12" width="75" height="58" rx="9" class="large"/><text x="707" y="48" text-anchor="middle" class="value">5</text><line x1="745" y1="41" x2="790" y2="41" class="arrow"/><rect x="795" y="12" width="75" height="58" rx="9" class="small"/><text x="832" y="48" text-anchor="middle" class="value">2</text>
<text x="815" y="100" class="tiny">蓝色：值 &lt; x；橙色：值 ≥ x</text>
</g>
<line x1="45" y1="265" x2="955" y2="265" class="divider"/>
<g transform="translate(0,285)">
<text x="45" y="45" class="panelTitle green">② 按原顺序分别串起来</text>
<text x="180" y="105" class="tagTextGreen">small</text>
<rect x="250" y="70" width="92" height="62" rx="9" class="dummy"/><text x="296" y="109" text-anchor="middle" class="tiny">dummy</text><line x1="342" y1="101" x2="388" y2="101" class="arrow"/><rect x="393" y="70" width="75" height="62" rx="9" class="small"/><text x="430" y="109" text-anchor="middle" class="value">1</text><line x1="468" y1="101" x2="513" y2="101" class="arrow"/><rect x="518" y="70" width="75" height="62" rx="9" class="small"/><text x="555" y="109" text-anchor="middle" class="value">2</text><line x1="593" y1="101" x2="638" y2="101" class="arrow"/><rect x="643" y="70" width="75" height="62" rx="9" class="small"/><text x="680" y="109" text-anchor="middle" class="value">2</text><text x="745" y="109" class="tiny">保持 1,2,2 的相对顺序</text>
<text x="180" y="205" class="tagTextOrange">large</text>
<rect x="250" y="170" width="92" height="62" rx="9" class="dummy"/><text x="296" y="209" text-anchor="middle" class="tiny">dummy</text><line x1="342" y1="201" x2="388" y2="201" class="arrow"/><rect x="393" y="170" width="75" height="62" rx="9" class="large"/><text x="430" y="209" text-anchor="middle" class="value">4</text><line x1="468" y1="201" x2="513" y2="201" class="arrow"/><rect x="518" y="170" width="75" height="62" rx="9" class="large"/><text x="555" y="209" text-anchor="middle" class="value">3</text><line x1="593" y1="201" x2="638" y2="201" class="arrow"/><rect x="643" y="170" width="75" height="62" rx="9" class="large"/><text x="680" y="209" text-anchor="middle" class="value">5</text><text x="745" y="209" class="tiny">保持 4,3,5 的相对顺序</text>
<path d="M680 140 C730 145 745 160 680 170" class="joinArrow"/><text x="750" y="148" class="accent">small 尾结点指向 large 首元结点</text>
<text x="745" y="250" class="body">最后：large-&gt;next = nullptr，避免旧链残留</text>
</g>
</svg>