<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650">
<defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity=".12"/></filter></defs>
<style>.title{font:700 26px 'Microsoft YaHei',sans-serif;fill:#172b4d}.subtitle{font:14px 'Microsoft YaHei',sans-serif;fill:#64748b}.body{font:15px 'Microsoft YaHei',sans-serif;fill:#334155}.tiny{font:12px 'Microsoft YaHei',sans-serif;fill:#64748b}.panelTitle{font:700 18px 'Microsoft YaHei',sans-serif;fill:#172b4d}.ring{fill:#f8fafc;stroke:#94a3b8;stroke-width:2;stroke-dasharray:7 6}.slotDot{fill:#e2e8f0;stroke:#94a3b8;stroke-width:2}.dataDot{fill:#dbeafe;stroke:#2563eb;stroke-width:2;filter:url(#shadow)}.frontDot{fill:#dcfce7;stroke:#16a34a;stroke-width:3;filter:url(#shadow)}.rearDot{fill:#fed7aa;stroke:#f97316;stroke-width:3;filter:url(#shadow)}.dotText{font:700 13px 'Microsoft YaHei',sans-serif;fill:#172b4d}.code{font:700 14px Consolas,'Microsoft YaHei',sans-serif;fill:#334155}.note{fill:#f8fafc;stroke:#cbd5e1}</style>
<text x="500" y="42" text-anchor="middle" class="title">循环队列：用取模把线性数组“首尾相接”</text>
<text x="500" y="71" text-anchor="middle" class="subtitle">常用约定：牺牲一个存储单元，区分队空与队满</text>
<g transform="translate(55,105)">
<text x="210" y="0" text-anchor="middle" class="panelTitle">队空</text>
<circle cx="210" cy="215" r="135" class="ring"/>
<circle cx="210" cy="80" r="24" class="frontDot"/><text x="210" y="54" text-anchor="middle" class="tiny">front/rear</text>
<circle cx="306" cy="125" r="24" class="slotDot"/><circle cx="345" cy="215" r="24" class="slotDot"/><circle cx="306" cy="305" r="24" class="slotDot"/><circle cx="210" cy="350" r="24" class="slotDot"/><circle cx="114" cy="305" r="24" class="slotDot"/><circle cx="75" cy="215" r="24" class="slotDot"/><circle cx="114" cy="125" r="24" class="slotDot"/>
<text x="210" y="390" text-anchor="middle" class="code">front == rear</text>
</g>
<g transform="translate(340,105)">
<text x="210" y="0" text-anchor="middle" class="panelTitle">有 3 个元素</text>
<circle cx="210" cy="215" r="135" class="ring"/>
<circle cx="210" cy="80" r="24" class="frontDot"/><text x="210" y="54" text-anchor="middle" class="tiny">front</text>
<circle cx="306" cy="125" r="24" class="dataDot"/><text x="306" y="131" text-anchor="middle" class="dotText">10</text>
<circle cx="345" cy="215" r="24" class="dataDot"/><text x="345" y="221" text-anchor="middle" class="dotText">20</text>
<circle cx="306" cy="305" r="24" class="dataDot"/><text x="306" y="311" text-anchor="middle" class="dotText">30</text>
<circle cx="210" cy="350" r="24" class="rearDot"/><text x="210" y="356" text-anchor="middle" class="dotText">R</text>
<circle cx="114" cy="305" r="24" class="slotDot"/><circle cx="75" cy="215" r="24" class="slotDot"/><circle cx="114" cy="125" r="24" class="slotDot"/>
<text x="210" y="390" text-anchor="middle" class="code">length = (rear + M - front) % M = 3</text>
</g>
<g transform="translate(625,105)">
<text x="210" y="0" text-anchor="middle" class="panelTitle">队满</text>
<circle cx="210" cy="215" r="135" class="ring"/>
<circle cx="210" cy="80" r="24" class="frontDot"/><text x="210" y="54" text-anchor="middle" class="tiny">front</text>
<circle cx="306" cy="125" r="24" class="dataDot"/><circle cx="345" cy="215" r="24" class="dataDot"/><circle cx="306" cy="305" r="24" class="dataDot"/><circle cx="210" cy="350" r="24" class="dataDot"/><circle cx="114" cy="305" r="24" class="dataDot"/><circle cx="75" cy="215" r="24" class="dataDot"/>
<circle cx="114" cy="125" r="24" class="rearDot"/><text x="114" y="131" text-anchor="middle" class="dotText">R</text>
<text x="210" y="390" text-anchor="middle" class="code">(rear + 1) % M == front</text>
</g>
<rect x="110" y="548" width="780" height="62" rx="12" class="note"/><text x="500" y="586" text-anchor="middle" class="body">入队后 rear 循环后移；出队后 front 循环后移。数组容量为 M，但最多保存 M-1 个元素。</text>
</svg>