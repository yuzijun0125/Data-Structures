<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker><marker id="green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#16a34a"/></marker><marker id="orange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#f97316"/></marker><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity=".10"/></filter></defs>
<style>.title{font:700 26px 'Microsoft YaHei',sans-serif;fill:#172b4d}.subtitle{font:14px 'Microsoft YaHei',sans-serif;fill:#64748b}.body{font:15px 'Microsoft YaHei',sans-serif;fill:#334155}.tiny{font:12px 'Microsoft YaHei',sans-serif;fill:#64748b}.value{font:700 18px 'Microsoft YaHei',sans-serif;fill:#172b4d}.nil{font:700 30px 'Microsoft YaHei',sans-serif;fill:#94a3b8}.headNode{fill:#ffedd5;stroke:#f97316;stroke-width:2;filter:url(#shadow)}.dataNode{fill:#dbeafe;stroke:#2563eb;stroke-width:2;filter:url(#shadow)}.rearNode{fill:#fed7aa;stroke:#f97316;stroke-width:2;filter:url(#shadow)}.arrow{stroke:#2563eb;stroke-width:3;marker-end:url(#arrow)}.greenArrow{stroke:#16a34a;stroke-width:3;marker-end:url(#green)}.orangeArrow{stroke:#f97316;stroke-width:3;marker-end:url(#orange)}.frontTag{fill:#16a34a}.rearTag{fill:#f97316}.tagText{font:700 14px 'Microsoft YaHei',sans-serif;fill:white}.box{stroke-width:2}.blueBox{fill:#eff6ff;stroke:#60a5fa}.orangeBox{fill:#fff7ed;stroke:#fb923c}.panelTitle{font:700 18px 'Microsoft YaHei',sans-serif}.blue{fill:#1d4ed8}.orange{fill:#c2410c}.code{font:700 14px Consolas,'Microsoft YaHei',sans-serif;fill:#172b4d}.note{fill:#f8fafc;stroke:#cbd5e1}</style>
<text x="500" y="42" text-anchor="middle" class="title">链队列：队头出、队尾入</text>
<text x="500" y="71" text-anchor="middle" class="subtitle">front 指向头结点；rear 指向最后一个元素</text>
<rect x="55" y="130" width="100" height="58" rx="10" class="frontTag"/><text x="105" y="166" text-anchor="middle" class="tagText">front</text>
<line x1="155" y1="159" x2="205" y2="159" class="greenArrow"/>
<rect x="210" y="120" width="115" height="78" rx="10" class="headNode"/><text x="267" y="153" text-anchor="middle" class="value">头结点</text><text x="267" y="180" text-anchor="middle" class="tiny">next 指向 10</text>
<line x1="325" y1="159" x2="380" y2="159" class="arrow"/>
<rect x="385" y="120" width="115" height="78" rx="10" class="dataNode"/><text x="442" y="153" text-anchor="middle" class="value">10</text><text x="442" y="180" text-anchor="middle" class="tiny">队头</text>
<line x1="500" y1="159" x2="555" y2="159" class="arrow"/>
<rect x="560" y="120" width="115" height="78" rx="10" class="dataNode"/><text x="617" y="153" text-anchor="middle" class="value">20</text>
<line x1="675" y1="159" x2="730" y2="159" class="arrow"/>
<rect x="735" y="120" width="115" height="78" rx="10" class="rearNode"/><text x="792" y="153" text-anchor="middle" class="value">30</text><text x="792" y="180" text-anchor="middle" class="tiny">队尾</text>
<line x1="850" y1="159" x2="900" y2="159" class="arrow"/><text x="930" y="169" text-anchor="middle" class="nil">∅</text>
<rect x="690" y="48" width="100" height="48" rx="10" class="rearTag"/><text x="740" y="80" text-anchor="middle" class="tagText">rear</text><line x1="790" y1="80" x2="792" y2="120" class="orangeArrow"/>
<g transform="translate(0,260)">
<rect x="60" y="0" width="410" height="190" rx="16" class="box blueBox"/><text x="265" y="42" text-anchor="middle" class="panelTitle blue">入队：插到 rear 之后</text><text x="265" y="88" text-anchor="middle" class="code">rear-&gt;next = p;</text><text x="265" y="126" text-anchor="middle" class="code">rear = p;</text><text x="265" y="164" text-anchor="middle" class="tiny">不会移动 front，也不影响已有元素</text>
</g>
<g transform="translate(530,260)">
<rect x="0" y="0" width="410" height="190" rx="16" class="box orangeBox"/><text x="205" y="42" text-anchor="middle" class="panelTitle orange">出队：删除头结点之后的首元结点</text><text x="205" y="88" text-anchor="middle" class="code">p = front-&gt;next;</text><text x="205" y="126" text-anchor="middle" class="code">front-&gt;next = p-&gt;next;</text><text x="205" y="164" text-anchor="middle" class="tiny">若删的是最后一个元素，还要令 rear = front</text>
</g>
<rect x="150" y="500" width="700" height="62" rx="12" class="note"/><text x="500" y="538" text-anchor="middle" class="body">空队条件：front == rear，此时两者都指向头结点。</text>
</svg>