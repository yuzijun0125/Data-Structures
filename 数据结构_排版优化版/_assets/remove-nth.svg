<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker><marker id="green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#16a34a"/></marker><marker id="red" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#dc2626"/></marker><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity=".10"/></filter></defs>
<style>.title{font:700 26px 'Microsoft YaHei',sans-serif;fill:#172b4d}.subtitle{font:14px 'Microsoft YaHei',sans-serif;fill:#64748b}.body{font:14px 'Microsoft YaHei',sans-serif;fill:#334155}.tiny{font:12px 'Microsoft YaHei',sans-serif;fill:#64748b}.value{font:700 21px 'Microsoft YaHei',sans-serif;fill:#172b4d}.panelTitle{font:700 18px 'Microsoft YaHei',sans-serif;fill:#172b4d}.blue{fill:#1d4ed8}.green{fill:#15803d}.node{fill:#dbeafe;stroke:#2563eb;stroke-width:2;filter:url(#shadow)}.dummy{fill:#e2e8f0;stroke:#64748b;stroke-width:2;stroke-dasharray:6 5}.target{fill:#ffedd5;stroke:#f97316;stroke-width:2}.remove{fill:#fee2e2;stroke:#dc2626;stroke-width:2}.slowNode{fill:#dcfce7;stroke:#16a34a;stroke-width:3}.arrow{stroke:#2563eb;stroke-width:3;marker-end:url(#arrow)}.fastPath{fill:none;stroke:#16a34a;stroke-width:3;stroke-dasharray:8 6}.slowPath{fill:none;stroke:#16a34a;stroke-width:4;marker-end:url(#green)}.deletePath{fill:none;stroke:#dc2626;stroke-width:4;marker-end:url(#red)}.greenText{font:700 14px 'Microsoft YaHei',sans-serif;fill:#15803d}.blueText{font:700 14px 'Microsoft YaHei',sans-serif;fill:#1d4ed8}.redText{font:700 14px 'Microsoft YaHei',sans-serif;fill:#b91c1c}.divider{stroke:#cbd5e1;stroke-width:2;stroke-dasharray:8 7}</style>
<text x="500" y="42" text-anchor="middle" class="title">删除倒数第 n 个结点：让快慢指针先拉开 n+1 步</text>
<text x="500" y="71" text-anchor="middle" class="subtitle">示例：head = [1,2,3,4,5]，n = 2；目标结点是 4，前驱结点是 3</text>
<g transform="translate(0,115)">
<text x="45" y="35" class="panelTitle blue">① fast 先走 n+1 步</text>
<rect x="130" y="68" width="105" height="62" rx="9" class="dummy"/><text x="182" y="107" text-anchor="middle" class="body">dummy</text>
<line x1="235" y1="99" x2="280" y2="99" class="arrow"/><rect x="285" y="68" width="80" height="62" rx="9" class="node"/><text x="325" y="107" text-anchor="middle" class="value">1</text><line x1="365" y1="99" x2="410" y2="99" class="arrow"/><rect x="415" y="68" width="80" height="62" rx="9" class="node"/><text x="455" y="107" text-anchor="middle" class="value">2</text><line x1="495" y1="99" x2="540" y2="99" class="arrow"/><rect x="545" y="68" width="80" height="62" rx="9" class="target"/><text x="585" y="107" text-anchor="middle" class="value">3</text><line x1="625" y1="99" x2="670" y2="99" class="arrow"/><rect x="675" y="68" width="80" height="62" rx="9" class="remove"/><text x="715" y="107" text-anchor="middle" class="value">4</text><line x1="755" y1="99" x2="800" y2="99" class="arrow"/><rect x="805" y="68" width="80" height="62" rx="9" class="node"/><text x="845" y="107" text-anchor="middle" class="value">5</text>
<path d="M182 148 L325 148 L715 148" class="fastPath"/><text x="448" y="180" text-anchor="middle" class="greenText">fast 从 dummy 走 3 步到达 4</text>
<text x="182" y="225" text-anchor="middle" class="blueText">slow 仍在 dummy</text>
<path d="M182 202 L182 140" class="slowPath"/>
</g>
<line x1="45" y1="360" x2="955" y2="360" class="divider"/>
<g transform="translate(0,380)">
<text x="45" y="35" class="panelTitle green">② fast、slow 同时前进，直到 fast 为空</text>
<rect x="130" y="68" width="105" height="62" rx="9" class="dummy"/><text x="182" y="107" text-anchor="middle" class="body">dummy</text>
<line x1="235" y1="99" x2="280" y2="99" class="arrow"/><rect x="285" y="68" width="80" height="62" rx="9" class="node"/><text x="325" y="107" text-anchor="middle" class="value">1</text><line x1="365" y1="99" x2="410" y2="99" class="arrow"/><rect x="415" y="68" width="80" height="62" rx="9" class="node"/><text x="455" y="107" text-anchor="middle" class="value">2</text><line x1="495" y1="99" x2="540" y2="99" class="arrow"/><rect x="545" y="68" width="80" height="62" rx="9" class="slowNode"/><text x="585" y="107" text-anchor="middle" class="value">3</text><text x="585" y="155" text-anchor="middle" class="tiny greenText">slow</text><line x1="625" y1="99" x2="670" y2="99" class="arrow"/><rect x="675" y="68" width="80" height="62" rx="9" class="remove"/><text x="715" y="107" text-anchor="middle" class="value">4</text><text x="715" y="155" text-anchor="middle" class="tiny redText">删除目标</text><line x1="755" y1="99" x2="800" y2="99" class="arrow"/><rect x="805" y="68" width="80" height="62" rx="9" class="node"/><text x="845" y="107" text-anchor="middle" class="value">5</text>
<path d="M182 195 C450 220 760 210 890 160" class="slowPath"/><text x="540" y="235" text-anchor="middle" class="greenText">当 fast == nullptr，slow 正好在待删除结点的前驱位置</text>
<path d="M585 52 C660 15 760 18 845 52" class="deletePath"/><text x="715" y="30" text-anchor="middle" class="redText">slow-&gt;next = slow-&gt;next-&gt;next</text>
<text x="875" y="100" class="tiny">fast = ∅</text>
</g>
</svg>