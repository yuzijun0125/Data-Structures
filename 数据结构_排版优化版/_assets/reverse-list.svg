<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker><marker id="reverse" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#16a34a"/></marker><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity=".10"/></filter></defs>
<style>.title{font:700 26px 'Microsoft YaHei',sans-serif;fill:#172b4d}.subtitle{font:14px 'Microsoft YaHei',sans-serif;fill:#64748b}.body{font:14px 'Microsoft YaHei',sans-serif;fill:#334155}.tiny{font:12px 'Microsoft YaHei',sans-serif;fill:#64748b}.value{font:700 22px 'Microsoft YaHei',sans-serif;fill:#172b4d}.panelTitle{font:700 18px 'Microsoft YaHei',sans-serif;fill:#172b4d}.node{fill:#dbeafe;stroke:#2563eb;stroke-width:2;filter:url(#shadow)}.curr{fill:#dcfce7;stroke:#16a34a}.temp{fill:#ffedd5;stroke:#f97316}.prev{fill:#e0e7ff;stroke:#4f46e5}.nullBox{fill:#f8fafc;stroke:#94a3b8;stroke-dasharray:6 5}.arrow{stroke:#2563eb;stroke-width:3;marker-end:url(#arrow)}.reverseArrow{stroke:#16a34a;stroke-width:4;marker-end:url(#reverse)}.nil{font:700 30px 'Microsoft YaHei',sans-serif;fill:#94a3b8}.greenText{fill:#15803d}.orangeText{fill:#c2410c}.blueText{fill:#4338ca}.accent{font:700 14px 'Microsoft YaHei',sans-serif;fill:#15803d}.divider{stroke:#cbd5e1;stroke-width:2;stroke-dasharray:8 7}.codeBox{fill:#f8fafc;stroke:#cbd5e1}.code{font:700 13px Consolas,'Microsoft YaHei',sans-serif;fill:#172b4d}</style>
<text x="500" y="42" text-anchor="middle" class="title">反转链表：三步循环，逐个改向</text>
<text x="500" y="71" text-anchor="middle" class="subtitle">目标：1 → 2 → 3 → ∅  变成  ∅ ← 1 ← 2 ← 3</text>
<g transform="translate(0,110)">
<text x="45" y="32" class="panelTitle">① 初始状态</text>
<rect x="130" y="60" width="90" height="58" rx="9" class="nullBox"/><text x="175" y="96" text-anchor="middle" class="body">prev = ∅</text>
<line x1="220" y1="89" x2="275" y2="89" class="arrow"/>
<rect x="280" y="60" width="85" height="58" rx="9" class="node curr"/><text x="322" y="96" text-anchor="middle" class="value">1</text><text x="322" y="140" text-anchor="middle" class="tiny greenText">curr</text>
<line x1="365" y1="89" x2="420" y2="89" class="arrow"/>
<rect x="425" y="60" width="85" height="58" rx="9" class="node temp"/><text x="467" y="96" text-anchor="middle" class="value">2</text><text x="467" y="140" text-anchor="middle" class="tiny orangeText">temp</text>
<line x1="510" y1="89" x2="565" y2="89" class="arrow"/>
<rect x="570" y="60" width="85" height="58" rx="9" class="node"/><text x="612" y="96" text-anchor="middle" class="value">3</text>
<line x1="655" y1="89" x2="710" y2="89" class="arrow"/><text x="745" y="99" text-anchor="middle" class="nil">∅</text>
</g>
<line x1="45" y1="292" x2="955" y2="292" class="divider"/>
<g transform="translate(0,310)">
<text x="45" y="32" class="panelTitle">② 处理结点 1 后</text>
<rect x="80" y="60" width="85" height="58" rx="9" class="node prev"/><text x="122" y="96" text-anchor="middle" class="value">1</text><text x="122" y="140" text-anchor="middle" class="tiny blueText">prev</text>
<line x1="165" y1="89" x2="220" y2="89" class="reverseArrow"/>
<text x="195" y="76" text-anchor="middle" class="tiny">1-&gt;next = ∅</text>
<rect x="280" y="60" width="85" height="58" rx="9" class="node curr"/><text x="322" y="96" text-anchor="middle" class="value">2</text><text x="322" y="140" text-anchor="middle" class="tiny greenText">curr</text>
<line x1="365" y1="89" x2="420" y2="89" class="arrow"/>
<rect x="425" y="60" width="85" height="58" rx="9" class="node temp"/><text x="467" y="96" text-anchor="middle" class="value">3</text><text x="467" y="140" text-anchor="middle" class="tiny orangeText">temp</text>
<line x1="510" y1="89" x2="565" y2="89" class="arrow"/>
<rect x="570" y="60" width="85" height="58" rx="9" class="node"/><text x="612" y="96" text-anchor="middle" class="value">∅</text>
<rect x="700" y="50" width="235" height="78" rx="12" class="codeBox"/><text x="817" y="82" text-anchor="middle" class="code">temp = curr-&gt;next;</text><text x="817" y="108" text-anchor="middle" class="code">curr-&gt;next = prev;</text><text x="817" y="134" text-anchor="middle" class="code">prev = curr; curr = temp;</text>
</g>
<g transform="translate(0,500)">
<text x="45" y="32" class="panelTitle">③ 循环结束</text>
<rect x="220" y="60" width="85" height="58" rx="9" class="node prev"/><text x="262" y="96" text-anchor="middle" class="value">3</text>
<line x1="305" y1="89" x2="360" y2="89" class="reverseArrow"/>
<rect x="365" y="60" width="85" height="58" rx="9" class="node"/><text x="407" y="96" text-anchor="middle" class="value">2</text>
<line x1="450" y1="89" x2="505" y2="89" class="reverseArrow"/>
<rect x="510" y="60" width="85" height="58" rx="9" class="node"/><text x="552" y="96" text-anchor="middle" class="value">1</text>
<line x1="595" y1="89" x2="650" y2="89" class="reverseArrow"/><text x="685" y="99" text-anchor="middle" class="nil">∅</text>
<text x="262" y="140" text-anchor="middle" class="tiny blueText">prev / 新头</text><text x="600" y="52" text-anchor="middle" class="accent">curr == nullptr，返回 prev</text>
</g>
</svg>