<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680">
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker>
  <marker id="orange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#f97316"/></marker>
  <marker id="green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#16a34a"/></marker>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity=".10"/></filter>
</defs>
<style>
  .title{font:700 26px 'Microsoft YaHei',sans-serif;fill:#172b4d}
  .subtitle{font:14px 'Microsoft YaHei',sans-serif;fill:#64748b}
  .body{font:14px 'Microsoft YaHei',sans-serif;fill:#334155}
  .tiny{font:12px 'Microsoft YaHei',sans-serif;fill:#64748b}
  .value{font:700 21px 'Microsoft YaHei',sans-serif;fill:#172b4d}
  .panelTitle{font:700 17px 'Microsoft YaHei',sans-serif;fill:#172b4d}
  .blue{fill:#1d4ed8}.orange{fill:#c2410c}.green{fill:#15803d}
  .card{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.5}
  .number{fill:#dbeafe;stroke:#2563eb;stroke-width:2;filter:url(#shadow)}
  .operator{fill:#ffedd5;stroke:#f97316;stroke-width:2;filter:url(#shadow)}
  .result{fill:#dcfce7;stroke:#16a34a;stroke-width:2;filter:url(#shadow)}
  .slot{fill:#ffffff;stroke:#94a3b8;stroke-width:1.5;stroke-dasharray:5 4}
  .arrow{stroke:#2563eb;stroke-width:3;marker-end:url(#arrow)}
  .orangeArrow{stroke:#f97316;stroke-width:3;marker-end:url(#orange)}
  .greenArrow{stroke:#16a34a;stroke-width:3;marker-end:url(#green)}
  .topLine{stroke:#f97316;stroke-width:2;stroke-dasharray:5 4}
</style>
<text x="500" y="42" text-anchor="middle" class="title">逆波兰表达式求值：数字入栈，运算符弹出并计算</text>
<text x="500" y="71" text-anchor="middle" class="subtitle">示例：[ "2", "1", "+", "3", "*" ] 的计算过程</text>

<g transform="translate(0,105)">
  <text x="42" y="24" class="panelTitle blue">从左到右扫描 tokens</text>
  <rect x="80" y="38" width="120" height="52" rx="10" class="number"/><text x="140" y="72" text-anchor="middle" class="value">2</text>
  <line x1="200" y1="64" x2="224" y2="64" class="arrow"/>
  <rect x="240" y="38" width="120" height="52" rx="10" class="number"/><text x="300" y="72" text-anchor="middle" class="value">1</text>
  <line x1="360" y1="64" x2="384" y2="64" class="arrow"/>
  <rect x="400" y="38" width="120" height="52" rx="10" class="operator"/><text x="460" y="72" text-anchor="middle" class="value">+</text>
  <line x1="520" y1="64" x2="544" y2="64" class="arrow"/>
  <rect x="560" y="38" width="120" height="52" rx="10" class="number"/><text x="620" y="72" text-anchor="middle" class="value">3</text>
  <line x1="680" y1="64" x2="704" y2="64" class="arrow"/>
  <rect x="720" y="38" width="120" height="52" rx="10" class="operator"/><text x="780" y="72" text-anchor="middle" class="value">*</text>
  <text x="900" y="72" class="body">结束</text>
</g>

<g transform="translate(35,300)">
  <rect x="0" y="0" width="170" height="330" rx="16" class="card"/>
  <text x="85" y="31" text-anchor="middle" class="panelTitle blue">① 读入 2</text>
  <text x="85" y="56" text-anchor="middle" class="tiny">数字：直接压栈</text>
  <rect x="60" y="235" width="50" height="50" rx="9" class="number"/><text x="85" y="267" text-anchor="middle" class="value">2</text>
  <text x="85" y="305" text-anchor="middle" class="blue">stack: [2]</text>
</g>
<g transform="translate(225,300)">
  <rect x="0" y="0" width="170" height="330" rx="16" class="card"/>
  <text x="85" y="31" text-anchor="middle" class="panelTitle blue">② 读入 1</text>
  <text x="85" y="56" text-anchor="middle" class="tiny">数字：直接压栈</text>
  <rect x="60" y="185" width="50" height="50" rx="9" class="number"/><text x="85" y="217" text-anchor="middle" class="value">1</text>
  <rect x="60" y="235" width="50" height="50" rx="9" class="number"/><text x="85" y="267" text-anchor="middle" class="value">2</text>
  <line x1="30" y1="210" x2="52" y2="210" class="orangeArrow"/><text x="26" y="204" text-anchor="end" class="tiny orange">top</text>
  <text x="85" y="305" text-anchor="middle" class="blue">stack: [2, 1]</text>
</g>
<g transform="translate(415,300)">
  <rect x="0" y="0" width="170" height="330" rx="16" class="card"/>
  <text x="85" y="31" text-anchor="middle" class="panelTitle orange">③ 读入 +</text>
  <text x="85" y="56" text-anchor="middle" class="tiny">弹出 num2，再弹出 num1</text>
  <rect x="60" y="235" width="50" height="50" rx="9" class="result"/><text x="85" y="267" text-anchor="middle" class="value">3</text>
  <text x="85" y="154" text-anchor="middle" class="body">num1 = 2</text>
  <text x="85" y="178" text-anchor="middle" class="body">num2 = 1</text>
  <text x="85" y="215" text-anchor="middle" class="green">2 + 1 = 3</text>
  <text x="85" y="305" text-anchor="middle" class="green">stack: [3]</text>
</g>
<g transform="translate(605,300)">
  <rect x="0" y="0" width="170" height="330" rx="16" class="card"/>
  <text x="85" y="31" text-anchor="middle" class="panelTitle blue">④ 读入 3</text>
  <text x="85" y="56" text-anchor="middle" class="tiny">数字：直接压栈</text>
  <rect x="60" y="185" width="50" height="50" rx="9" class="number"/><text x="85" y="217" text-anchor="middle" class="value">3</text>
  <rect x="60" y="235" width="50" height="50" rx="9" class="result"/><text x="85" y="267" text-anchor="middle" class="value">3</text>
  <line x1="30" y1="210" x2="52" y2="210" class="orangeArrow"/><text x="26" y="204" text-anchor="end" class="tiny orange">top</text>
  <text x="85" y="305" text-anchor="middle" class="blue">stack: [3, 3]</text>
</g>
<g transform="translate(795,300)">
  <rect x="0" y="0" width="170" height="330" rx="16" class="card"/>
  <text x="85" y="31" text-anchor="middle" class="panelTitle orange">⑤ 读入 *</text>
  <text x="85" y="56" text-anchor="middle" class="tiny">弹出 num2，再弹出 num1</text>
  <rect x="60" y="235" width="50" height="50" rx="9" class="result"/><text x="85" y="267" text-anchor="middle" class="value">9</text>
  <text x="85" y="154" text-anchor="middle" class="body">num1 = 3</text>
  <text x="85" y="178" text-anchor="middle" class="body">num2 = 3</text>
  <text x="85" y="215" text-anchor="middle" class="green">3 * 3 = 9</text>
  <text x="85" y="305" text-anchor="middle" class="green">stack: [9]</text>
</g>

<text x="500" y="665" text-anchor="middle" class="body">最后一次运算的结果 9 留在栈顶，因此 return stk.top()</text>
</svg>
