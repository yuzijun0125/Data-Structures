<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#16a34a"/></marker><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity=".10"/></filter></defs>
<style>.title{font:700 26px 'Microsoft YaHei',sans-serif;fill:#172b4d}.subtitle{font:14px 'Microsoft YaHei',sans-serif;fill:#64748b}.body{font:16px 'Microsoft YaHei',sans-serif;fill:#334155}.tiny{font:12px 'Microsoft YaHei',sans-serif;fill:#64748b}.value{font:700 21px 'Microsoft YaHei',sans-serif;fill:#172b4d}.step{font:700 18px 'Microsoft YaHei',sans-serif;fill:#15803d}.accent{font:700 15px 'Microsoft YaHei',sans-serif;fill:#15803d}.cell{stroke:#2563eb;stroke-width:2;filter:url(#shadow)}.filled{fill:#dbeafe}.empty{fill:#f8fafc;stroke-dasharray:6 5}.remove{fill:#fee2e2;stroke:#ef4444}.stale{fill:#f1f5f9;stroke:#94a3b8}.move{fill:none;stroke:#16a34a;stroke-width:3;stroke-dasharray:8 6;marker-end:url(#arrow)}.note{fill:#ecfdf5;stroke:#86efac}</style>
<text x="500" y="42" text-anchor="middle" class="title">顺序表删除：从前往后覆盖，长度减一</text>
<text x="500" y="70" text-anchor="middle" class="subtitle">目标：删除第 i=3 个元素 C</text>
<g transform="translate(0,100)">
<text x="40" y="25" class="step">① 删除前</text>
<rect x="170" y="0" width="80" height="60" class="cell filled"/><text x="210" y="38" text-anchor="middle" class="value">A</text>
<rect x="250" y="0" width="80" height="60" class="cell filled"/><text x="290" y="38" text-anchor="middle" class="value">B</text>
<rect x="330" y="0" width="80" height="60" class="cell remove"/><text x="370" y="38" text-anchor="middle" class="value">C</text>
<rect x="410" y="0" width="80" height="60" class="cell filled"/><text x="450" y="38" text-anchor="middle" class="value">D</text>
<rect x="490" y="0" width="80" height="60" class="cell filled"/><text x="530" y="38" text-anchor="middle" class="value">E</text>
<rect x="570" y="0" width="80" height="60" class="cell empty"/><text x="610" y="38" text-anchor="middle" class="tiny">空闲</text>
<text x="685" y="38" class="body">length = 5</text>
</g>
<g transform="translate(0,250)">
<text x="40" y="25" class="step">② 第 i 位开始逐个左移</text>
<rect x="170" y="0" width="80" height="60" class="cell filled"/><text x="210" y="38" text-anchor="middle" class="value">A</text>
<rect x="250" y="0" width="80" height="60" class="cell filled"/><text x="290" y="38" text-anchor="middle" class="value">B</text>
<rect x="330" y="0" width="80" height="60" class="cell filled"/><text x="370" y="38" text-anchor="middle" class="value">D</text>
<rect x="410" y="0" width="80" height="60" class="cell filled"/><text x="450" y="38" text-anchor="middle" class="value">E</text>
<rect x="490" y="0" width="80" height="60" class="cell stale"/><text x="530" y="38" text-anchor="middle" class="tiny">旧值</text>
<rect x="570" y="0" width="80" height="60" class="cell empty"/><text x="610" y="38" text-anchor="middle" class="tiny">空闲</text>
<text x="685" y="38" class="body">length = 4</text>
<path d="M450 92 C450 132 370 132 355 90" class="move"/><text x="400" y="151" text-anchor="middle" class="accent">j 从 i 走到 length-1：elem[j-1] = elem[j]</text>
</g>
<rect x="40" y="405" width="920" height="62" rx="12" class="note"/><text x="65" y="442" class="body">length 减一后，最后一个旧值已不属于顺序表；是否清零不影响正确性，但清零更便于调试。</text>
</svg>