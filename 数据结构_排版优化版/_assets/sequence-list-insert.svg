<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#f97316"/></marker><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity=".10"/></filter></defs>
<style>.title{font:700 26px 'Microsoft YaHei',sans-serif;fill:#172b4d}.subtitle{font:14px 'Microsoft YaHei',sans-serif;fill:#64748b}.body{font:16px 'Microsoft YaHei',sans-serif;fill:#334155}.tiny{font:12px 'Microsoft YaHei',sans-serif;fill:#64748b}.value{font:700 21px 'Microsoft YaHei',sans-serif;fill:#172b4d}.step{font:700 18px 'Microsoft YaHei',sans-serif;fill:#1d4ed8}.accent{font:700 15px 'Microsoft YaHei',sans-serif;fill:#c2410c}.cell{stroke:#2563eb;stroke-width:2;filter:url(#shadow)}.filled{fill:#dbeafe}.empty{fill:#f8fafc;stroke-dasharray:6 5}.focus{fill:#ffedd5;stroke:#f97316}.insert{fill:#dcfce7;stroke:#16a34a}.move{fill:none;stroke:#f97316;stroke-width:3;stroke-dasharray:8 6;marker-end:url(#arrow)}.warn{fill:#fff7ed;stroke:#fdba74}</style>
<text x="500" y="42" text-anchor="middle" class="title">顺序表插入：从后往前搬，给新元素腾位置</text>
<text x="500" y="70" text-anchor="middle" class="subtitle">目标：在第 i=3 个位置插入 99</text>
<g transform="translate(0,100)">
<text x="40" y="25" class="step">① 原表</text>
<rect x="170" y="0" width="80" height="60" class="cell filled"/><text x="210" y="38" text-anchor="middle" class="value">A</text>
<rect x="250" y="0" width="80" height="60" class="cell filled"/><text x="290" y="38" text-anchor="middle" class="value">B</text>
<rect x="330" y="0" width="80" height="60" class="cell focus"/><text x="370" y="38" text-anchor="middle" class="value">C</text>
<rect x="410" y="0" width="80" height="60" class="cell filled"/><text x="450" y="38" text-anchor="middle" class="value">D</text>
<rect x="490" y="0" width="80" height="60" class="cell filled"/><text x="530" y="38" text-anchor="middle" class="value">E</text>
<rect x="570" y="0" width="80" height="60" class="cell empty"/><text x="610" y="38" text-anchor="middle" class="tiny">空闲</text>
<text x="685" y="38" class="body">length = 5</text>
<path d="M210 95 C210 130 600 130 610 95" class="move"/><text x="410" y="135" text-anchor="middle" class="accent">j 从 length 倒着走到 i：elem[j] = elem[j-1]</text>
</g>
<g transform="translate(0,250)">
<text x="40" y="25" class="step">② 后移完成，写入新值</text>
<rect x="170" y="0" width="80" height="60" class="cell filled"/><text x="210" y="38" text-anchor="middle" class="value">A</text>
<rect x="250" y="0" width="80" height="60" class="cell filled"/><text x="290" y="38" text-anchor="middle" class="value">B</text>
<rect x="330" y="0" width="80" height="60" class="cell insert"/><text x="370" y="38" text-anchor="middle" class="value">99</text>
<rect x="410" y="0" width="80" height="60" class="cell filled"/><text x="450" y="38" text-anchor="middle" class="value">C</text>
<rect x="490" y="0" width="80" height="60" class="cell filled"/><text x="530" y="38" text-anchor="middle" class="value">D</text>
<rect x="570" y="0" width="80" height="60" class="cell filled"/><text x="610" y="38" text-anchor="middle" class="value">E</text>
<text x="695" y="38" class="body">length = 6</text>
<text x="210" y="92" text-anchor="middle" class="tiny">位序 1</text><text x="290" y="92" text-anchor="middle" class="tiny">位序 2</text><text x="370" y="92" text-anchor="middle" class="tiny">位序 3</text><text x="450" y="92" text-anchor="middle" class="tiny">位序 4</text><text x="530" y="92" text-anchor="middle" class="tiny">位序 5</text><text x="610" y="92" text-anchor="middle" class="tiny">位序 6</text>
</g>
<rect x="40" y="405" width="920" height="62" rx="12" class="warn"/><text x="65" y="442" class="body">最容易写错的方向：插入必须“从后往前”移动；若从前往后会覆盖尚未搬走的数据。</text>
</svg>