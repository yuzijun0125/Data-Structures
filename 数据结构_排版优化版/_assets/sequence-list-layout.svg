<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity=".10"/></filter></defs>
<style>.title{font:700 26px 'Microsoft YaHei',sans-serif;fill:#172b4d}.subtitle{font:14px 'Microsoft YaHei',sans-serif;fill:#64748b}.label{font:700 16px 'Microsoft YaHei',sans-serif;fill:#334155}.body{font:16px 'Microsoft YaHei',sans-serif;fill:#334155}.tiny{font:12px 'Microsoft YaHei',sans-serif;fill:#64748b}.value{font:700 21px 'Microsoft YaHei',sans-serif;fill:#172b4d}.cell{stroke:#2563eb;stroke-width:2;filter:url(#shadow)}.filled{fill:#dbeafe}.empty{fill:#f8fafc;stroke-dasharray:6 5}.arrow{stroke:#2563eb;stroke-width:3;marker-end:url(#arrow);fill:none}.note{fill:#f1f5f9;stroke:#cbd5e1}.accentBox{fill:#eff6ff;stroke:#93c5fd;stroke-width:2}.accentTitle{font:700 18px 'Microsoft YaHei',sans-serif;fill:#1d4ed8}.big{font:700 32px 'Microsoft YaHei',sans-serif;fill:#1d4ed8}</style>
<text x="500" y="46" text-anchor="middle" class="title">顺序表：连续存储 + 逻辑位序</text>
<text x="500" y="75" text-anchor="middle" class="subtitle">逻辑位序从 1 开始；C++ 数组下标从 0 开始，因此访问第 i 个元素使用 elem[i-1]</text>
<text x="42" y="132" class="label">elem</text>
<line x1="105" y1="128" x2="154" y2="128" class="arrow"/>
<g>
  <rect x="55" y="150" width="70" height="64" class="cell filled"/><text x="90" y="190" text-anchor="middle" class="value">12</text><text x="90" y="235" text-anchor="middle" class="tiny">0 / 位序 1</text>
  <rect x="125" y="150" width="70" height="64" class="cell filled"/><text x="160" y="190" text-anchor="middle" class="value">7</text><text x="160" y="235" text-anchor="middle" class="tiny">1 / 位序 2</text>
  <rect x="195" y="150" width="70" height="64" class="cell filled"/><text x="230" y="190" text-anchor="middle" class="value">25</text><text x="230" y="235" text-anchor="middle" class="tiny">2 / 位序 3</text>
  <rect x="265" y="150" width="70" height="64" class="cell filled"/><text x="300" y="190" text-anchor="middle" class="value">18</text><text x="300" y="235" text-anchor="middle" class="tiny">3 / 位序 4</text>
  <rect x="335" y="150" width="70" height="64" class="cell filled"/><text x="370" y="190" text-anchor="middle" class="value">9</text><text x="370" y="235" text-anchor="middle" class="tiny">4 / 位序 5</text>
  <rect x="405" y="150" width="70" height="64" class="cell empty"/><text x="440" y="190" text-anchor="middle" class="tiny">未使用</text><text x="440" y="235" text-anchor="middle" class="tiny">5</text>
  <rect x="475" y="150" width="70" height="64" class="cell empty"/><text x="510" y="190" text-anchor="middle" class="tiny">未使用</text><text x="510" y="235" text-anchor="middle" class="tiny">6</text>
  <rect x="545" y="150" width="70" height="64" class="cell empty"/><text x="580" y="190" text-anchor="middle" class="tiny">未使用</text><text x="580" y="235" text-anchor="middle" class="tiny">7</text>
  <rect x="615" y="150" width="70" height="64" class="cell empty"/><text x="650" y="190" text-anchor="middle" class="tiny">未使用</text><text x="650" y="235" text-anchor="middle" class="tiny">8</text>
  <rect x="685" y="150" width="70" height="64" class="cell empty"/><text x="720" y="190" text-anchor="middle" class="tiny">未使用</text><text x="720" y="235" text-anchor="middle" class="tiny">9</text>
</g>
<rect x="55" y="275" width="700" height="86" rx="12" class="note"/>
<text x="82" y="307" class="body">length = 5：只允许访问 elem[0] ~ elem[4]</text>
<text x="82" y="338" class="body">MAXSIZE = 10：容量固定，插入前必须同时检查“表满”和位序合法</text>
<rect x="790" y="165" width="155" height="130" rx="16" class="accentBox"/>
<text x="867" y="198" text-anchor="middle" class="accentTitle">随机访问</text>
<text x="867" y="233" text-anchor="middle" class="big">O(1)</text>
<text x="867" y="268" text-anchor="middle" class="tiny">按下标直接定位</text>
</svg>