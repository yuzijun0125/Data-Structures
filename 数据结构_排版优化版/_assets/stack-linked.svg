<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity=".10"/></filter></defs>
<style>.title{font:700 26px 'Microsoft YaHei',sans-serif;fill:#172b4d}.subtitle{font:14px 'Microsoft YaHei',sans-serif;fill:#64748b}.tiny{font:12px 'Microsoft YaHei',sans-serif;fill:#64748b}.value{font:700 21px 'Microsoft YaHei',sans-serif;fill:#172b4d}.pointer{fill:#172b4d}.pointerText{font:700 15px 'Microsoft YaHei',sans-serif;fill:white}.node{fill:#dbeafe;stroke:#2563eb;stroke-width:2;filter:url(#shadow)}.topNode{fill:#fed7aa;stroke:#f97316;stroke-width:2;filter:url(#shadow)}.arrow{stroke:#2563eb;stroke-width:3;marker-end:url(#arrow)}.nil{font:700 30px 'Microsoft YaHei',sans-serif;fill:#94a3b8}.box{stroke-width:2}.blueBox{fill:#eff6ff;stroke:#60a5fa}.orangeBox{fill:#fff7ed;stroke:#fb923c}.panelTitle{font:700 20px 'Microsoft YaHei',sans-serif}.blue{fill:#1d4ed8}.orange{fill:#c2410c}.code{font:700 15px Consolas,'Microsoft YaHei',sans-serif;fill:#172b4d}.accent{font:700 15px 'Microsoft YaHei',sans-serif;fill:#c2410c}</style>
<text x="500" y="42" text-anchor="middle" class="title">链栈：栈顶就是链表的首元结点</text>
<text x="500" y="71" text-anchor="middle" class="subtitle">只能在 S 指向的一端执行插入和删除，均为 O(1)</text>
<rect x="50" y="130" width="105" height="60" rx="10" class="pointer"/><text x="102" y="167" text-anchor="middle" class="pointerText">栈顶 S</text>
<line x1="155" y1="160" x2="215" y2="160" class="arrow"/>
<rect x="220" y="118" width="125" height="84" rx="10" class="topNode"/><text x="282" y="154" text-anchor="middle" class="value">30</text><text x="282" y="181" text-anchor="middle" class="tiny">栈顶</text>
<line x1="345" y1="160" x2="405" y2="160" class="arrow"/>
<rect x="410" y="118" width="125" height="84" rx="10" class="node"/><text x="472" y="154" text-anchor="middle" class="value">20</text><text x="472" y="181" text-anchor="middle" class="tiny">栈中</text>
<line x1="535" y1="160" x2="595" y2="160" class="arrow"/>
<rect x="600" y="118" width="125" height="84" rx="10" class="node"/><text x="662" y="154" text-anchor="middle" class="value">10</text><text x="662" y="181" text-anchor="middle" class="tiny">栈底</text>
<line x1="725" y1="160" x2="785" y2="160" class="arrow"/><text x="825" y="170" text-anchor="middle" class="nil">∅</text>
<g transform="translate(0,285)">
<rect x="60" y="0" width="400" height="220" rx="16" class="box blueBox"/>
<text x="260" y="42" text-anchor="middle" class="panelTitle blue">入栈</text>
<text x="260" y="82" text-anchor="middle" class="code">p-&gt;data = e;</text><text x="260" y="116" text-anchor="middle" class="code">p-&gt;next = S;</text><text x="260" y="150" text-anchor="middle" class="code">S = p;</text>
<text x="260" y="192" text-anchor="middle" class="tiny">先让新结点接住原栈顶，再更新 S</text>
</g>
<g transform="translate(540,285)">
<rect x="0" y="0" width="400" height="220" rx="16" class="box orangeBox"/>
<text x="200" y="42" text-anchor="middle" class="panelTitle orange">出栈</text>
<text x="200" y="82" text-anchor="middle" class="code">p = S;</text><text x="200" y="116" text-anchor="middle" class="code">e = p-&gt;data;</text><text x="200" y="150" text-anchor="middle" class="code">S = S-&gt;next;  delete p;</text>
<text x="200" y="192" text-anchor="middle" class="tiny">先保存栈顶，再后移并释放</text>
</g>
<text x="500" y="570" text-anchor="middle" class="accent">链栈通常不设头结点；空栈时 S == nullptr。</text>
</svg>