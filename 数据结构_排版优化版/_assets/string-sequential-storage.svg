<rect x="72" y="345" width="850" height="58" rx="12" class="note"/>
<text x="98" y="371" class="body">SString 同时保存定长数组 ch[MAXLEN + 1] 和当前长度 length。</text>
<text x="98" y="393" class="body">有效字符只在 ch[1] ~ ch[length]；ch[0] 不参与匹配，因此串算法中的下标统一从 1 开始。</text>
<rect x="925" y="352" width="0" height="0"/>
