<style>.title{font:700 26px 'Microsoft YaHei',sans-serif;fill:#172b4d}.subtitle{font:14px 'Microsoft YaHei',sans-serif;fill:#64748b}.label{font:700 17px 'Microsoft YaHei',sans-serif;fill:#334155}.body{font:15px 'Microsoft YaHei',sans-serif;fill:#334155}.tiny{font:12px 'Microsoft YaHei',sans-serif;fill:#64748b}.index{font:700 13px 'Microsoft YaHei',sans-serif;fill:#475569}.value{font:700 21px Consolas,'Microsoft YaHei',sans-serif;fill:#172b4d}.cell{stroke:#2563eb;stroke-width:2;filter:url(#shadow)}.filled{fill:#dbeafe}.pattern{fill:#dcfce7;stroke:#16a34a}.empty{fill:#f8fafc;stroke:#94a3b8;stroke-dasharray:6 5}.note{fill:#f1f5f9;stroke:#cbd5e1}.accentBox{fill:#eff6ff;stroke:#93c5fd;stroke-width:2}.accentTitle{font:700 17px 'Microsoft YaHei',sans-serif;fill:#1d4ed8}.code{font:700 14px Consolas,'Microsoft YaHei',sans-serif;fill:#172b4d}.arrow{stroke:#2563eb;stroke-width:3;marker-end:url(#arrow);fill:none}</style>
<text x="500" y="45" text-anchor="middle" class="title">顺序串：ch[0] 空出，字符从位序 1 开始</text>
<text x="500" y="75" text-anchor="middle" class="subtitle">length 直接保存有效字符个数；访问第 i 个字符使用 ch[i]，不需要依赖末尾的 '\0'</text>
<text x="36" y="153" class="label">主串 S</text>
